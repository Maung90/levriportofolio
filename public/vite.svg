<svg width="680" height="260" viewBox="0 0 680 260" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Levri signature wordmark</title>
  <desc>Stylized wordmark of the name Levri with geometric editorial aesthetic</desc>

  <!-- Background -->
  <rect width="680" height="260" fill="#0a0a0a"/>

  <!-- Thin horizontal rule top & bottom -->
  <line x1="40" y1="48" x2="640" y2="48" stroke="#333" stroke-width="0.5"/>
  <line x1="40" y1="212" x2="640" y2="212" stroke="#333" stroke-width="0.5"/>

  <!-- Corner marks -->
  <rect x="40" y="40" width="6" height="6" fill="#F9BE31"/>
  <rect x="634" y="40" width="6" height="6" fill="#F9BE31"/>
  <rect x="40" y="206" width="6" height="6" fill="#F9BE31" opacity="0.4"/>
  <rect x="634" y="206" width="6" height="6" fill="#F9BE31" opacity="0.4"/>

  <!-- === L === -->
  <rect x="68" y="68" width="14" height="120" fill="#ffffff"/>
  <rect x="68" y="174" width="58" height="14" fill="#ffffff"/>

  <!-- === E === -->
  <rect x="148" y="68" width="14" height="120" fill="#ffffff"/>
  <rect x="148" y="68" width="54" height="14" fill="#ffffff"/>
  <rect x="148" y="121" width="42" height="12" fill="#ffffff"/>
  <rect x="148" y="174" width="54" height="14" fill="#ffffff"/>

  <!-- === V === -->
  <polygon points="224,68 240,68 278,188 262,188" fill="#ffffff"/>
  <polygon points="300,68 316,68 278,188 262,188" fill="#ffffff"/>

  <!-- === R === -->
  <rect x="336" y="68" width="14" height="120" fill="#ffffff"/>
  <rect x="336" y="68" width="44" height="12" fill="#ffffff"/>
  <rect x="366" y="68" width="14" height="52" fill="#ffffff"/>
  <rect x="336" y="108" width="44" height="12" fill="#ffffff"/>
  <polygon points="354,120 368,120 396,188 382,188" fill="#ffffff"/>

  <!-- === I === -->
  <rect x="414" y="68" width="50" height="12" fill="#ffffff"/>
  <rect x="432" y="68" width="14" height="120" fill="#ffffff"/>
  <rect x="414" y="176" width="50" height="12" fill="#ffffff"/>

  <!-- Accent dot -->
  <rect x="472" y="176" width="12" height="12" fill="#F9BE31"/>

  <!-- Version tag -->
  <text x="610" y="66" font-family="monospace" font-size="11" fill="#F9BE31" text-anchor="end" opacity="0.7">v.01</text>

  <!-- Tagline -->
  <text x="340" y="236" font-family="monospace" font-size="11" fill="#555555" text-anchor="middle" letter-spacing="4">WEB DEVELOPER · BALI</text>
</svg>